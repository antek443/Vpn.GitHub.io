<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrimClient - Pobierz Cheaty</title>
    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: #16161f;
            --accent: #ff3e3e;
            --text: #ffffff;
            --text-muted: #8a8a98;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #252533;
        }
        h1 { color: var(--accent); margin-top: 0; font-size: 28px; }
        h2 { font-size: 20px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #333344;
            background: #09090d;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover { background: #cc3232; }
        .admin-btn { background: #333344; margin-top: 15px; }
        .admin-btn:hover { background: #444455; }
        .hidden { display: none; }
        .error { color: #ff4a4a; margin-top: 10px; font-weight: bold; }
        .success { color: #4aff4a; margin-top: 10px; font-weight: bold; }
        .code-list { text-align: left; max-height: 150px; overflow-y: auto; background: #09090d; padding: 10px; border-radius: 6px; font-family: monospace; }
        .code-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        .delete-btn { color: var(--accent); cursor: pointer; background: none; border: none; width: auto; padding: 0; font-size: 14px; }
    </style>
</head>
<body>

    <!-- PANEL UŻYTKOWNIKA -->
    <div id="user-panel" class="container">
        <h1>GrimClient</h1>
        <p style="color: var(--text-muted)">Wprowadź wygenerowany kod, aby odebrać dostęp.</p>
        <input type="text" id="user-code" placeholder="Gcl-XXX-XXX-XXX">
        <button onclick="redeemCode()">Odbierz cheaty</button>
        <div id="user-msg"></div>
        <button class="admin-btn" onclick="showAdminLogin()">Panel Admina</button>
    </div>

    <!-- LOGOWANIE ADMINA -->
    <div id="admin-login" class="container hidden">
        <h2>Logowanie Admina</h2>
        <input type="password" id="admin-pass" placeholder="Hasło">
        <button onclick="loginAdmin()">Zaloguj</button>
        <div id="login-msg" class="error"></div>
        <button class="admin-btn" onclick="showUserPanel()">Powrót</button>
    </div>

    <!-- PANEL ADMINA -->
    <div id="admin-panel" class="container hidden">
        <h2>Panel Administratora</h2>
        
        <label style="display:block; text-align:left; font-size:14px; color:var(--text-muted)">Link do cheatów:</label>
        <input type="text" id="cheat-link" placeholder="https://twoj-link-do-pobrania.com" onchange="saveLink()">
        
        <button onclick="generateCode()" style="background: #28a745; margin-top: 10px;">Generuj kod Gcl</button>
        
        <h3 style="text-align: left; margin-top: 20px; font-size: 16px;">Aktywne kody:</h3>
        <div class="code-list" id="active-codes"></div>
        
        <button class="admin-btn" onclick="logoutAdmin()">Wyloguj</button>
    </div>

    <script>
        // Inicjalizacja danych z localStorage
        let codes = JSON.parse(localStorage.getItem('grim_codes')) || [];
        let downloadLink = localStorage.getItem('grim_link') || '';

        document.getElementById('cheat-link').value = downloadLink;

        function showAdminLogin() {
            hideAll();
            document.getElementById('admin-login').classList.remove('hidden');
        }

        function showUserPanel() {
            hideAll();
            document.getElementById('user-panel').classList.remove('hidden');
        }

        function hideAll() {
            document.getElementById('user-panel').classList.add('hidden');
            document.getElementById('admin-login').classList.add('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('user-msg').innerHTML = '';
            document.getElementById('login-msg').innerHTML = '';
        }

        function loginAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === '12345') {
                hideAll();
                document.getElementById('admin-panel').classList.remove('hidden');
                renderCodes();
            } else {
                document.getElementById('login-msg').innerText = 'Błędne hasło!';
            }
            document.getElementById('admin-pass').value = '';
        }

        function logoutAdmin() {
            showUserPanel();
        }

        function saveLink() {
            downloadLink = document.getElementById('cheat-link').value;
            localStorage.setItem('grim_link', downloadLink);
        }

        function getRandomSegment() {
            return Math.floor(100 + Math.random() * 900).toString(); // Losuje 3 cyfry (100-999)
        }

        function generateCode() {
            const newCode = `Gcl-${getRandomSegment()}-${getRandomSegment()}-${getRandomSegment()}`;
            codes.push(newCode);
            localStorage.setItem('grim_codes', JSON.stringify(codes));
            renderCodes();
        }

        function deleteCode(index) {
            codes.splice(index, 1);
            localStorage.setItem('grim_codes', JSON.stringify(codes));
            renderCodes();
        }

        function renderCodes() {
            const listDiv = document.getElementById('active-codes');
            listDiv.innerHTML = '';
            if (codes.length === 0) {
                listDiv.innerHTML = '<span style="color:#555">Brak wygenerowanych kodów</span>';
                return;
            }
            codes.forEach((code, index) => {
                listDiv.innerHTML += `
                    <div class="code-item">
                        <span>${code}</span>
                        <button class="delete-btn" onclick="deleteCode(${index})">Usuń</button>
                    </div>
                `;
            });
        }

        function redeemCode() {
            const inputCode = document.getElementById('user-code').value.trim();
            const msgDiv = document.getElementById('user-msg');
            
            if (!inputCode) {
                msgDiv.innerHTML = '<p class="error">Wpisz kod!</p>';
                return;
            }

            const codeIndex = codes.indexOf(inputCode);

            if (codeIndex !== -1) {
                if (!downloadLink) {
                    msgDiv.innerHTML = '<p class="error">Kod poprawny, ale admin nie ustawił jeszcze linku do pobrania!</p>';
                    return;
                }
                msgDiv.innerHTML = `
                    <p class="success">Kod poprawny!</p>
                    <a href="${downloadLink}" target="_blank" style="color:#fff; background:#28a745; display:block; padding:12px; text-decoration:none; font-weight:bold; border-radius:6px; margin-top:10px;">POBIERZ GRIMCLIENT</a>
                `;
                // Usuwa kod po użyciu, żeby nikt go nie użył drugi raz
                codes.splice(codeIndex, 1);
                localStorage.setItem('grim_codes', JSON.stringify(codes));
            } else {
                msgDiv.innerHTML = '<p class="error">Nieprawidłowy lub zużyty kod!</p>';
            }
            document.getElementById('user-code').value = '';
        }
    </script>
</body>
</html>
