<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrimClient</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0c0c12;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .box {
            background-color: #171722;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 2px solid #ff3e3e;
        }
        h1 { color: #ff3e3e; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #000000;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        /* Nowe, bezpieczne przyciski z prostym efektem uniesienia */
        .przycisk {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #ff3e3e;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin: 15px 0;
            box-sizing: border-box;
            transition: transform 0.1s ease;
        }
        .przycisk:hover {
            transform: translateY(-3px); /* Efekt podniesienia */
            background-color: #ff5555;
        }
        .szary-btn {
            background-color: #333344;
        }
        .szary-btn:hover {
            background-color: #444455;
        }
        .niebieski-btn {
            background-color: #007bff;
        }
        .niebieski-btn:hover {
            background-color: #1a8cff;
        }
        .zielony-btn {
            background-color: #28a745;
            text-decoration: none;
        }
        .zielony-btn:hover {
            background-color: #2fc952;
        }
        .ukryty {
            display: none !important;
        }
        .error { color: #ff4a4a; font-weight: bold; margin: 10px 0; }
        .success { color: #4aff4a; font-weight: bold; margin: 10px 0; }
        .lista-kodow {
            text-align: left;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
        }
        .linia-kodu {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .usun-btn {
            color: #ff3e3e;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. PANEL UŻYTKOWNIKA -->
    <div id="panel-user" class="box">
        <h1>GrimClient</h1>
        <p>Wpisz kod, aby odebrać cheaty:</p>
        <input type="text" id="kod-user" placeholder="Gcl-XXX-XXX-XXX">
        <button class="przycisk" onclick="odbierzCheaty()">Odbierz cheaty</button>
        <div id="komunikat-user"></div>
        <button class="przycisk szary-btn" onclick="pokazLogowanie()">Panel Admina</button>
    </div>

    <!-- 2. LOGOWANIE ADMINA -->
    <div id="panel-login" class="box ukryty">
        <h2>Logowanie Admina</h2>
        <input type="password" id="haslo-admin" placeholder="Wpisz hasło">
        <button class="przycisk" onclick="zalogujAdmina()">Zaloguj się</button>
        <div id="komunikat-login" class="error"></div>
        <button class="przycisk szary-btn" onclick="pokazUsera()">Powrót</button>
    </div>

    <!-- 3. PANEL GLOWNY ADMINA -->
    <div id="panel-admin" class="box ukryty">
        <h2>Panel Administratora</h2>
        <p>Link do pobrania cheatów:</p>
        <input type="text" id="link-input" placeholder="https://..." onchange="zapiszLink()">
        
        <button class="przycisk niebieski-btn" onclick="generujKod()">Generuj kod Gcl</button>
        
        <p style="text-align: left; color: #888;">Aktywne kody:</p>
        <div class="lista-kodow" id="widok-kodow"></div>
        
        <button class="przycisk szary-btn" onclick="wylogujAdmina()">Wyloguj</button>
    </div>

    <script>
        // Tablica na kody i zmienna na link
        let kody = [];
        let plikLink = "";

        // Próba wczytania danych z pamięci przeglądarki przy starcie
        if(localStorage.getItem('grim_kody')) {
            kody = JSON.parse(localStorage.getItem('grim_kody'));
        }
        if(localStorage.getItem('grim_link')) {
            plikLink = localStorage.getItem('grim_link');
            document.getElementById('link-input').value = plikLink;
        }

        // Funkcje przełączania widoków
        function pokazLogowanie() {
            document.getElementById('panel-user').classList.add('ukryty');
            document.getElementById('panel-login').classList.remove('ukryty');
            document.getElementById('panel-admin').classList.add('ukryty');
        }

        function pokazUsera() {
            document.getElementById('panel-user').classList.remove('ukryty');
            document.getElementById('panel-login').classList.add('ukryty');
            document.getElementById('panel-admin').classList.add('ukryty');
            document.getElementById('komunikat-user').innerHTML = "";
            document.getElementById('komunikat-login').innerHTML = "";
        }

        function zalogujAdmina() {
            let wpisaneHaslo = document.getElementById('haslo-admin').value;
            if (wpisaneHaslo === "12345") {
                document.getElementById('panel-login').classList.add('ukryty');
                document.getElementById('panel-admin').classList.remove('ukryty');
                odswiezListeKodow();
            } else {
                document.getElementById('komunikat-login').innerText = "Błędne hasło! (Wpisz: 12345)";
            }
            document.getElementById('haslo-admin').value = "";
        }

        function wylogujAdmina() {
            pokazUsera();
        }

        // Funkcje Admina
        function zapiszLink() {
            plikLink = document.getElementById('link-input').value;
            localStorage.setItem('grim_link', plikLink);
        }

        function generujKod() {
            let n1 = Math.floor(100 + Math.random() * 900);
            let n2 = Math.floor(100 + Math.random() * 900);
            let n3 = Math.floor(100 + Math.random() * 900);
            let nowyKod = "Gcl-" + n1 + "-" + n2 + "-" + n3;
            
            kody.push(nowyKod);
            localStorage.setItem('grim_kody', JSON.stringify(kody));
            odswiezListeKodow();
        }

        function usunKod(index) {
            kody.splice(index, 1);
            localStorage.setItem('grim_kody', JSON.stringify(kody));
            odswiezListeKodow();
        }

        function odswiezListeKodow() {
            let kontener = document.getElementById('widok-kodow');
            kontener.innerHTML = "";
            
            if (kody.length === 0) {
                kontener.innerHTML = "<span style='color:#666;'>Brak kodów</span>";
                return;
            }

            for (let i = 0; i < kody.length; i++) {
                kontener.innerHTML += `
                    <div class="linia-kodu">
                        <span>${kody[i]}</span>
                        <button class="usun-btn" onclick="usunKod(${i})">Usuń</button>
                    </div>
                `;
            }
        }

        // Odbieranie kodów przez Użytkownika
        function odbierzCheaty() {
            let wpisanyKod = document.getElementById('kod-user').value.trim();
            let miejsceNaKomunikat = document.getElementById('komunikat-user');
            
            if (wpisanyKod === "") {
                miejsceNaKomunikat.innerHTML = "<p class='error'>Wpisz kod!</p>";
                return;
            }

            let pozycja = kody.indexOf(wpisanyKod);

            if (pozycja !== -1) {
                if (plikLink === "") {
                    miejsceNaKomunikat.innerHTML = "<p class='error'>Kod poprawny, ale admin nie dodał jeszcze linku do pobrania!</p>";
                    return;
                }
                
                miejsceNaKomunikat.innerHTML = `
                    <p class="success">Kod poprawny!</p>
                    <a href="${plikLink}" target="_blank" class="przycisk zielony-btn">POBIERZ CHEATY</a>
                `;
                
                // Usuń kod z bazy, aby był jednorazowy
                kody.splice(pozycja, 1);
                localStorage.setItem('grim_kody', JSON.stringify(kody));
            } else {
                miejsceNaKomunikat.innerHTML = "<p class='error'>Nieprawidłowy lub zużyty kod!</p>";
            }
            document.getElementById('kod-user').value = "";
        }
    </script>
</body>
</html>
